[project]
name = "repoqa"
version = "0.1.0"
description = "Ask questions about any codebase; answers cite the exact file and lines."
readme = "README.md"
license = "MIT"
authors = [{ name = "Chakshu Jindal" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.3.0",
    "chromadb==1.5.9",
    "fastapi==0.162.0",
    "openai==3.42.1",
    "pathspec==1.1.1",
    "pydantic==2.14.2",
    "pyyaml==6.0.3",
    "rank-bm25==0.2.2",
    "rich==15.0.0",
    "typer==0.27.3",
    "uvicorn==0.54.0",
]

[project.scripts]
repoqa = "repoqa.cli:app"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repoqa"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=repoqa --cov-report=term-missing --cov-fail-under=95"
