<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>repoqa</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --line: #d6d3d1;
    --card: #ffffff; --accent: #1d4ed8; --cite-bg: #e0e7ff; --warn: #b45309; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c;
      --card: #1c1917; --accent: #93c5fd; --cite-bg: #1e3a8a; --warn: #fbbf24; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 52rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
  h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
  .sub { margin: 0 0 1.5rem; color: var(--muted); }
  form { display: grid; gap: .75rem; }
  label { font-weight: 600; font-size: .9rem; }
  textarea, input { width: 100%; padding: .6rem .7rem; border: 1px solid var(--line);
                    border-radius: 8px; background: var(--card); color: var(--fg); font: inherit; }
  textarea { min-height: 5rem; resize: vertical; }
  .row { display: flex; gap: .75rem; align-items: end; flex-wrap: wrap; }
  .row > div { flex: 1 1 14rem; display: grid; gap: .25rem; }
  button { padding: .6rem 1.2rem; border: 0; border-radius: 8px; background: var(--accent);
           color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #status { min-height: 1.5rem; margin: 1rem 0; color: var(--muted); }
  #status.error { color: var(--err); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 1rem 1.2rem; }
  #answer-text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .cite { background: var(--cite-bg); border-radius: 4px; padding: 0 .3rem;
          font: .85em ui-monospace, SFMono-Regular, Menlo, monospace; }
  .warn { color: var(--warn); }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: .9rem; }
  th, td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid var(--line); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-wrap { overflow-x: auto; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>repoqa</h1>
  <p class="sub">Ask a question about an indexed repository. Every claim cites a file and line range.</p>

  <form id="ask-form">
    <label for="question">Question</label>
    <textarea id="question" name="question" required maxlength="2000"
              placeholder="How are Python files split into chunks?"></textarea>
    <div class="row">
      <div>
        <label for="repo">Repository index (optional)</label>
        <input id="repo" name="repo" list="repos" autocomplete="off" placeholder="default">
        <datalist id="repos"></datalist>
      </div>
      <button id="submit" type="submit">Ask</button>
    </div>
  </form>

  <p id="status" role="status" aria-live="polite"></p>

  <section id="result" class="card" hidden aria-labelledby="result-heading">
    <h2 id="result-heading" style="margin-top:0;font-size:1.1rem">Answer</h2>
    <div id="answer-text"></div>
    <p id="rejected" class="warn" hidden></p>
    <div class="table-wrap">
      <table>
        <caption style="text-align:left;color:var(--muted)">Retrieved sources</caption>
        <thead><tr><th scope="col">#</th><th scope="col">Citation</th><th scope="col">Symbol</th>
          <th scope="col" class="num">Cosine</th></tr></thead>
        <tbody id="sources"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function renderAnswer(text) {
    // Escape first, then wrap [path:12-40] citations; the regex runs on already-escaped text.
    return escapeHtml(text).replace(/\[([\w.\/@+-]+:\d+(?:-\d+)?)\]/g,
      '<span class="cite">$1</span>');
  }

  function setStatus(message, isError = false) {
    $("status").textContent = message;
    $("status").classList.toggle("error", isError);
  }

  async function loadRepos() {
    try {
      const res = await fetch("/health");
      if (!res.ok) return;
      const data = await res.json().catch(() => ({}));
      $("repos").replaceChildren(...(data.repos || []).map((name) => new Option(name)));
    } catch (err) {
      setStatus("Could not reach the server.", true);
    }
  }

  $("ask-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const question = $("question").value.trim();
    if (!question) return;
    const body = { question };
    if ($("repo").value.trim()) body.repo = $("repo").value.trim();

    $("submit").disabled = true;
    setStatus("Searching the code and drafting an answer...");
    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 429) {
        setStatus(`Rate limited. Try again in ${res.headers.get("Retry-After") || "a few"} s.`, true);
        return;
      }
      if (!res.ok) {
        const detail = typeof data.detail === "string" ? data.detail : "Invalid request.";
        setStatus(`Error ${res.status}: ${detail}`, true);
        return;
      }
      showResult(data);
      setStatus(data.answered ? "" : "No source was relevant enough to answer.");
    } catch (err) {
      setStatus("Network error: could not reach the server.", true);
    } finally {
      $("submit").disabled = false;
    }
  });

  function showResult(data) {
    $("answer-text").innerHTML = renderAnswer(data.answer);
    const rejected = data.rejected_citations;
    $("rejected").hidden = rejected.length === 0;
    $("rejected").textContent = `${rejected.length} citation(s) not backed by retrieved code: ${rejected.join(", ")}`;
    $("sources").replaceChildren(...data.sources.map((src) => {
      const row = document.createElement("tr");
      const cells = [
        String(src.id) + (src.cited ? " (cited)" : ""),
        src.citation,
        src.symbol || "",
        src.similarity === null ? "-" : src.similarity.toFixed(2),
      ];
      cells.forEach((value, i) => {
        const cell = document.createElement("td");
        cell.textContent = value;
        if (i === 3) cell.className = "num";
        row.append(cell);
      });
      return row;
    }));
    $("result").hidden = false;
  }

  loadRepos();
</script>
</body>
</html>
